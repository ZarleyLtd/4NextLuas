name: Daily timetable ingest

on:
  schedule:
    - cron: "55 3 * * *"        # 03:55 UTC, staggered after 4NextBus at 03:40
  workflow_dispatch:
    inputs:
      force:
        description: "Rewrite every stop (ignore manifest)"
        type: boolean
        default: false

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ vars.AWS_REGION || 'eu-west-1' }}
      FOURNEXTLUAS_TABLE: ${{ vars.FOURNEXTLUAS_TABLE || 'FourNextLuas' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Build timetable and write changed stops
        run: python -m ingest.build_timetable ${{ inputs.force && '--force' || '' }}
